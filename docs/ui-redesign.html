      if(page==='examples')return appBar('示例脚本','从关键用法开始，再看完整示例','editor')+body(`<p class="subhead">每个片段包含必要的截图、判断和释放步骤；复制后修改素材名与坐标。</p><div class="chiprow">${['关键用法','完整示例'].map(x=>chip(x,state.sampleTab===x,'sampleTab')).join('')}</div>${state.sampleTab==='关键用法'?`<div class="mini-title">分类</div><div class="chiprow">${['全部','准备','点击','找图','OCR','判断'].map(x=>chip(x,state.category===x,'category')).join('')}</div><div class="mini-title">示例片段</div><div class="card">${item('shield','申请截屏并释放图片','准备 · 截屏安全流程','examplePreview','blue')}${item('target','找图并点击','找图 · 匹配与点击','examplePreview','warm')}${item('code','识别文字并点击','OCR · 文本定位','examplePreview')}${item('clock','循环查找与超时','判断 · 等待和停止条件','examplePreview','blue')}</div>`:`<div class="mini-title">完整示例</div><div class="card">${item('code','完整脚本 API 演示','展示公开函数、属性及图色识别流程','examplePreview','blue')}</div>`}`);
      if(page==='examplePreview')return appBar('找图并点击','关键用法 · 找图','examples')+`<div class="scroll"><div class="page-body"><p class="subhead">先获取截图，在图片中查找目标。找到后点击，并在最后释放图片。</p><div class="code">${exampleCode}</div><div class="sticker" style="margin-top:12px">实际运行前请把 images/sign.png 改成自己的任务素材。</div></div></div><div class="detail-footer"><div class="actions">${btn('返回','examples')}${btn('光标插入','editor','soft')}<button class="btn primary" data-action="toast" data-value="示例代码已复制">复制代码</button></div></div>`;
      if(page==='loop')return appBar('循环执行',state.taskName,'taskDetail')+body(`<p class="subhead">每轮从头执行整个任务；出错或按停止键时结束。</p><div class="stack">${choice('指定次数','运行固定次数后结束',state.loop,'loop')}${choice('指定执行时间','到时中断当前轮',state.loop,'loop')}${choice('直到手动停止','持续运行，手动结束',state.loop,'loop')}</div><div class="mini-title">运行参数</div><div class="card card-pad stack">${state.loop==='指定次数'?field('执行次数','2','', 'loop-count'):state.loop==='指定执行时间'?`${field('执行时间','30','','loop-duration')}<div class="chiprow">${['秒','分钟','小时'].map((x,i)=>chip(x,i===1,'durationUnit')).join('')}</div>`:'<div class="hint">运行到按停止键为止。</div>'}${field('两轮间隔 · 秒','1','','loop-gap')}<div class="hint">0 表示完成后立即开始下一轮。</div></div>`)+`<div class="detail-footer">${btn('保存循环设置','taskDetail','primary wide')}</div>`;
      if(page==='schedule')return appBar('定时运行',state.taskName,'taskDetail')+body(`<div class="sticker">当前设置：每天 08:00 自动运行</div><div class="mini-title">运行频率</div><div class="chiprow">${['一次','间隔','每天'].map(x=>chip(x,state.schedule===x,'schedule')).join('')}</div><div class="card card-pad" style="margin-top:14px">${state.schedule==='每天'?field('每天几点','08:00','HH:mm','schedule-time'):state.schedule==='一次'?field('多少分钟后运行一次','30','','schedule-time'):field('每隔多少分钟（至少 15）','30','','schedule-time')}<p class="hint">${state.schedule==='每天'?'每天该时刻自动运行。':state.schedule==='一次'?'到点自动运行一次。':'首次在设定的间隔后运行。'}</p></div><button class="btn ghost" data-action="toast" data-value="已取消定时" style="margin-top:14px;color:var(--red)">取消当前定时</button>`)+`<div class="detail-footer">${btn('保存定时设置','taskDetail','primary wide')}</div>`;
      if(page==='history')return appBar('运行历史',state.taskName,'taskDetail',`<button class="btn small" data-action="toast" data-value="历史记录已清空">清空</button>`)+body(`<div class="section-row"><b>最近运行</b><small>共 3 次</small></div><div class="card"><div class="item">${tile('check')}<span class="item-main"><b>运行成功</b><small>今天 09:41 · 4.2 秒 · 手动启动</small></span>${badge('成功')}</div><div class="item">${tile('alert','red')}<span class="item-main"><b>脚本出错</b><small>昨天 08:00 · 第 8 行 · 素材未找到</small></span>${badge('错误','error')}</div><div class="item">${tile('stop','warm')}<span class="item-main"><b>手动停止</b><small>11 月 03 日 08:00 · 12 秒 · 定时启动</small></span>${badge('停止','warn')}</div></div><div class="mini-title">错误详情</div><div class="sticker" style="background:#fceae8;border-color:#f1c7c2;color:#9b4846">第 8 行：无法找到图片 images/sign.png。检查图片名称或素材目录。</div><div style="margin-top:12px">${btn('打开脚本并定位','editorError','soft')}</div>`);
      return '';
    }

      if(page==='captureTest')return appBar('正在测试截屏','请稍候','captureMode')+body(`<div class="card empty-state"><div class="empty-icon" style="background:#fff0e7;color:#d05b39">${icon('activity')}</div><h3>正在截取测试画面</h3><p>测试成功后才会保存「${state.mode}」。系统授权方式可能会先弹出授权提示。</p><div class="actions" style="justify-content:center">${btn('模拟测试通过','permissions','primary')}${btn('查看失败状态','captureError')}</div></div>`);
      if(page==='captureError')return appBar('截屏测试失败','原有设置仍然保留','captureMode')+body(`<div class="card empty-state"><div class="empty-icon" style="background:#fce9e8;color:#b84f4d">${icon('alert')}</div><h3>无法完成截屏</h3><p>设备未授予所选方式需要的权限，请检查系统授权或超级用户权限后重试。</p><div class="actions" style="justify-content:center">${btn('重试','captureTest','primary')}${btn('更换方式','captureMode')}</div></div>`);
      if(page==='systemPicker')return `<div class="system-shell"><div class="system-tag">系统界面示意 · Android 文件选择器</div><div class="row between"><button class="icon-btn" ${go('transfer')}>${icon('back')}</button><span class="badge gray">此界面由系统提供</span></div><h3>选择文件 / 保存位置</h3><p class="hint">最近使用 · 下载</p><div class="system-list">${item('file','任务合集.zip','ZIP 文件 · 128 KB','tasks','blue')}${item('image','素材图片.png','PNG 图片 · 42 KB','assets','warm')}${item('file','自动化任务.zip','ZIP 文件 · 72 KB','taskDetail')}</div><div class="sticker">真实应用会调用 Android 系统文件选择器；外观随设备和系统版本变化。</div><div style="margin-top:17px">${btn('确定并返回','tasks','primary wide')}</div><div class="system-bar"></div></div>`;
      return '';
    }
    // 悬浮面板与屏幕拾取保留“叠在目标应用上”的上下文，并展示各自的独立状态。
    function floatScreen(page){
      if(['floatTasks','floatEmpty','floatTools','floatRunning'].includes(page)){
        const tools=page==='floatTools',running=page==='floatRunning',empty=page==='floatEmpty';
        const header=`<div class="float-head">${tools?`<button class="icon-btn" aria-label="返回任务列表" ${go('floatTasks')}>${icon('back')}</button>`:`<span class="brand-icon" style="width:31px;height:31px;border-radius:9px;font-size:16px;flex:none"><span>雕</span></span>`}<div style="flex:1"><b>${tools?'快捷工具':running?'正在运行':'任务列表'}</b>${tools?'<small>屏幕拾取与操作录制</small>':''}</div>${!tools?badge(empty?'0 个任务':running?`执行 ${state.selected.length} 个`:`已选 ${state.selected.length} / 3`,'warn'):''}<button class="icon-btn" aria-label="收起" ${go('settings')}>${icon('close')}</button></div>`;
        const toolsPanel=`<div class="float-body"><div class="section-row"><b>选择工具</b><small>共 6 项</small></div><div class="float-tools">${[['target','取坐标','pickPoint'],['color','取色','pickColor'],['crop','选择范围','pickRegion'],['image','截图','pickShot'],['record','纯坐标录制','recording'],['record','录制操作','recordSetup']].map(([i,label,id])=>`<button class="float-tool" ${go(id)}>${icon(i)}${label}</button>`).join('')}</div><div class="sticker" style="margin-top:13px">拾取结果会复制为脚本代码，同时记录在运行日志中。</div></div><div class="float-footer">${btn('返回任务列表','floatTasks','wide')}</div>`;
        const cards=['每日签到','自动使用','确定同意'].map(name=>{
          const selected=state.selected.includes(name);
          return `<div class="float-cell ${selected&&!running?'selected':''}"><button class="float-select" data-action="selectTask" data-value="${name}" aria-pressed="${selected}" aria-label="${name}，${selected?`第 ${state.selected.indexOf(name)+1} 个入队，点击取消`:'点击加入队列'}"><span class="task-check ${selected?'checked':''}" aria-hidden="true">${selected?state.selected.indexOf(name)+1:''}</span><span class="float-task-info"><b>${name}</b></span></button></div>`;
        }).join('');
        const taskPanel=`<div class="float-body">${empty?`<div class="empty-state" style="padding:18px 8px"><div class="empty-icon">${icon('grid')}</div><h3>暂无任务</h3><p>在应用中创建或导入任务后即可运行。</p></div>`:`<div class="float-grid">${cards}</div>`}<button class="item" ${go('floatTools')} style="border:1px solid var(--line);border-radius:12px;background:#f8f8f3;margin-top:13px;padding:11px"><span class="tile-icon warm">${icon('target')}</span><span class="item-main"><b>快捷工具</b><small>取点、取色、截图与录制等 6 项</small></span>${icon('arrow')}</button></div><div class="float-footer">${running?btn(`${icon('stop')} 停止当前任务`,'floatTasks','danger wide'):empty?`<button class="btn wide" disabled>暂无可执行的任务</button>`:state.selected.length?`<button class="btn dark wide" data-action="runSelected">${icon('play')} 执行所选 ${state.selected.length} 个任务</button>`:`<button class="btn wide" disabled>请先选择任务</button>`}</div>`;
        const runningOverlay=running?`<div class="record-bar" style="top:8%;left:18px;right:18px"><span class="record-dot"></span><div style="flex:1"><b>${state.selected[0]||'任务'} · [1/${state.selected.length||1}]</b><small>双击悬浮球停止运行</small></div><button class="btn small danger" ${go('floatTasks')}>停止</button></div><button class="float-ball running" ${go('floatTasks')} aria-label="停止任务">雕</button>`:`<button class="float-ball" ${go('floatTasks')} aria-label="悬浮球">雕</button>`;
        return `<div class="float-backdrop"><div class="float-window">${header}${tools?toolsPanel:taskPanel}</div>${runningOverlay}</div>`;
      }
      if(['pickPoint','pickColor','pickRegion','pickShot'].includes(page)){
        const point=page==='pickPoint',color=page==='pickColor',region=page==='pickRegion';const name=point?'取坐标':color?'取色':region?'选择范围':'区域截图';
        const pickerAction=point||color?`<button class="btn primary wide" data-action="toast" data-value="结果已复制到剪贴板">${point?'生成 click(540, 932)':'复制颜色值 #52A083'}</button>`:`<button class="btn small" data-action="toast" data-value="已清除选区">重选</button>${region?`<button class="btn primary" data-action="pickerConfirm" data-value="范围代码已复制">生成代码</button>`:btn('保存截图','systemPicker','primary')}`;
        return `<div class="crosshair"><div class="picker-top"><span class="btn dark" style="pointer-events:none">${icon(point||color?'target':'crop')} ${name}</span><button class="btn small" ${go('floatTools')}>取消</button></div>${point||color?'<div class="picker-lens"></div>':'<div class="picker-region"></div>'}<div class="picker-bottom"><b>${point?'X 540　Y 932':color?'#52A083　·　X 540 Y 932':'X 180　Y 380　·　W 420 H 260'}</b><p>${point?'点击确认坐标，拖动可移动准星。':color?'点击采样屏幕颜色，拖动可调整位置。':'拖动框选屏幕区域，支持反向拖动和重选。'}</p><div class="actions">${pickerAction}</div></div></div>`;
      }
      if(page==='recordSetup')return `<div class="float-backdrop"><div class="float-window"><div class="float-head"><div style="flex:1"><b>录制操作</b><small>在目标应用中生成自动化任务</small></div><button class="icon-btn" ${go('floatTools')}>${icon('close')}</button></div><div class="float-body" style="max-height:490px;overflow:auto"><div class="stack">${field('新任务名称','录制_1105_094100','', 'record-name')}<span class="field-label">录制模式</span>${choice('记录坐标','记录点击位置，适合固定界面',state.recordMode,'recordMode')}${choice('记录图片','为每步截取模板，适合界面变化',state.recordMode,'recordMode')}<span class="field-label">截图尺寸与页面范围</span><div class="row"><div style="flex:1">${field('截图宽度','100','','record-w')}</div><div style="flex:1">${field('截图高度','100','','record-h')}</div></div><div class="row"><div style="flex:1">${field('页面范围宽度','500','','record-rw')}</div><div style="flex:1">${field('页面范围高度','500','','record-rh')}</div></div></div><p class="hint">两种模式都可以填写截图尺寸和页面范围。点击开始后在目标应用中操作。</p></div><div class="float-footer">${btn('显示录制悬浮条','recording','primary wide')}</div></div></div>`;
      if(page==='recording')return `<div class="float-backdrop"><div class="record-bar compact"><span class="record-dot" style="background:${state.recordPaused?'#83958d':'var(--orange)'}"></span><b style="flex:1">${state.recordPaused?'已暂停':'录制中'} · 4 步</b><button class="btn small" data-action="recordPause">${state.recordPaused?'继续':'暂停'}</button><button class="btn small primary" ${go('tasks')}>完成</button></div></div>`;
      return '';
    }
    // 重要确认和参数输入都以实际的手机弹层展示，而不是静态清单。
    function modalScreen(page){
      let heading='',sub='',content='',actions='';
      const cancel=btn('取消',modalBase[page]);
      const selectedAsset=state.assetSelected||'sign.png';
      const renamedAsset=selectedAsset==='confirm.png'?'confirm_new.png':'checkin.png';
      const selectedDimensions=selectedAsset==='confirm.png'?'240 × 80':'320 × 180';
      if(page==='newTask'){heading='新建任务';sub='选择一个起点，开始自动化';content=`<div class="stack">${field('任务名称','','例如：每日签到','new-task-name')}<span class="field-label">起始模板</span>${choice('空白脚本','从零开始编写脚本','空白脚本','scaffold')}${choice('每日签到','包含截图、找图与点击示例','空白脚本','scaffold')}${choice('找图任务','以图片素材作为识别目标','空白脚本','scaffold')}</div>`;actions=cancel+btn('创建并编辑','editor','primary');}
      if(page==='taskMenu'){heading=esc(state.taskName);sub='任务操作';content=`<div class="card" style="box-shadow:none">${item('code','编辑脚本','修改任务代码','editor','blue')}${item('file','重命名任务','保留原有内容','renameTask')}${item('clock','循环执行','每轮从头运行','loop','warm')}${item('clock','定时运行','一次、间隔或每天','schedule','warm')}${item('activity','运行历史','结果、耗时与错误','history')}${item('image','素材管理','预览、导入与裁剪','assets')}${item('download','导出 ZIP','脚本、配置及图片','transfer')}${item('alert','删除任务','删除全部相关文件','deleteTask','red')}</div>`;actions=btn('关闭','taskDetail');}
      if(page==='renameTask'){heading='重命名任务';sub='脚本、素材与定时设置将保留';content=field('任务名称',state.taskName,'','rename-task');actions=cancel+btn('保存','taskDetail','primary');}
      if(page==='renameAsset'){heading='重命名素材';sub=`${selectedAsset} · ${selectedDimensions} px`;content=field('文件名',selectedAsset,'','rename-asset');actions=cancel+btn('下一步','renameSync','primary');}
      if(page==='renameSync'){heading='脚本引用确认';sub='图片改名时一并更新 task.js';content=`<p class="hint">脚本中有 2 处引用，涉及 2 行。确认后一并修改：</p><div class="code" style="font-size:9px">第 8 行<br><span style="color:#f1a9a0">- "images/${selectedAsset}"</span><br><span style="color:#a8dbc0">+ "images/${renamedAsset}"</span><br><br>第 14 行<br><span style="color:#f1a9a0">- "images/${selectedAsset}"</span><br><span style="color:#a8dbc0">+ "images/${renamedAsset}"</span></div>`;actions=btn('返回','renameAsset')+btn('改名并同步脚本','assetPreview','primary');}
      if(page==='exactCrop'){heading='精确调整选区';sub='以原图像素为单位';content=`<div class="row" style="margin-bottom:12px"><div style="flex:1">${field('左上角 X',selectedAsset==='confirm.png'?'24':'48','','crop-x')}</div><div style="flex:1">${field('左上角 Y',selectedAsset==='confirm.png'?'12':'27','','crop-y')}</div></div><div class="row"><div style="flex:1">${field('宽度','160','','crop-w')}</div><div style="flex:1">${field('高度',selectedAsset==='confirm.png'?'54':'94','','crop-h')}</div></div><p class="hint">选区必须位于 ${selectedDimensions} px 原图内。</p>`;actions=cancel+btn('应用','crop','primary');}
      if(page==='saveTemplate'){heading='保存模板';sub='存入「每日签到」任务的 images/ 目录';content=`${field('文件名','checkin.png','','template-name')}<p class="hint">建议使用能辨识用途的名称，方便脚本引用。</p>`;actions=cancel+btn('保存','assets','primary');}
      if(page==='keepAlive'){heading='保活指引';sub='让长时间运行的任务更稳定';content=`<div class="stack">${['把本应用的电池优化设为「不受限制」','允许自启动与后台运行','在最近任务中锁定应用','无障碍服务被系统关闭后重新开启','长时间找图时建议保持屏幕常亮'].map((x,i)=>`<div class="row"><span class="badge gray">0${i+1}</span><span style="font-size:11px">${x}</span></div>`).join('')}</div>`;actions=btn('知道了','permissions','primary');}
      if(page==='deleteTask'){heading='删除任务';sub='此操作无法撤销';content=`<div class="sticker" style="background:#fceae8;border-color:#f1c7c2;color:#a64746">确定删除「${esc(state.taskName)}」？脚本、素材、录制范围图、运行历史及定时设置都会删除。</div>`;actions=cancel+btn('删除任务','tasks','danger');}
      if(page==='deleteAsset'){heading='删除素材';sub='此操作无法撤销';content=`<div class="sticker" style="background:#fceae8;border-color:#f1c7c2;color:#a64746">确定删除图片「${selectedAsset}」？使用这张图片的脚本可能无法继续执行。</div>`;actions=cancel+btn('删除图片','assets','danger');}
      if(page==='clearTasks'){heading='清空全部任务';sub='此操作无法撤销';content=`<div class="sticker" style="background:#fceae8;border-color:#f1c7c2;color:#a64746">确定删除全部 3 个任务？脚本、素材、录制范围图、运行历史及定时设置都会删除。</div>`;actions=cancel+btn('清空全部','tasksEmpty','danger');}
      if(page==='clearEditor'){heading='清空脚本';sub='清空后需手动点击保存';content=`<p>确定清空「${esc(state.taskName)}」的编辑内容？确认后仅修改编辑器中的内容，点击保存后才会写入文件。</p>`;actions=cancel+btn('清空内容','editor','danger');}
      if(page==='transfer'){heading='导入与导出';sub='通过系统文件选择器完成文件操作';content=`<div class="card" style="box-shadow:none">${item('upload','导入 ZIP','支持单任务 ZIP 与合集 ZIP','systemPicker','blue')}${item('download','导出当前任务','包含脚本、素材和配置','systemPicker','warm')}${item('download','导出全部任务','生成任务合集 ZIP','systemPicker')}</div><p class="hint">导出时由系统选择保存位置；导入同名任务会跳过，不覆盖现有内容。</p>`;actions=btn('关闭','tasks');}
      return `<div class="modal-mask"><div class="dialog" role="dialog" aria-modal="true" aria-label="${heading}"><div class="dialog-head"><h3>${heading}</h3><small>${sub}</small></div><div class="dialog-body">${content}</div><div class="dialog-footer">${actions}</div></div></div>`;
    }
    function screen(page){
      if(modalBase[page])return screen(modalBase[page])+modalScreen(page);
      return mainScreen(page)||taskScreen(page)||imageScreen(page)||floatScreen(page);
    }
    function render(){
      const current=meta[state.page]||meta.tasks;
      document.title=`${current[0]} · 雕雕助手 UI 设计稿`;
      document.getElementById('page-title').textContent=current[0];
      document.getElementById('page-subtitle').textContent=current[1];
      document.getElementById('phone-view').innerHTML=screen(state.page);
      const index=groups.flatMap(g=>g.items).findIndex(x=>x[0]===state.page)+1;
      document.getElementById('stage-number').textContent=String(index).padStart(2,'0');
      document.getElementById('navigation').innerHTML=groups.map(g=>`<div class="nav-group">${g.label}</div>${g.items.map(([id,label,i])=>`<button class="nav-item ${state.page===id?'active':''}" ${go(id)} aria-current="${state.page===id?'page':'false'}">${icon(i)}<span>${label}</span><span class="nav-num">${String(groups.flatMap(x=>x.items).findIndex(x=>x[0]===id)+1).padStart(2,'0')}</span></button>`).join('')}`).join('');
      document.getElementById('inspector').innerHTML=`<div class="inspector-label">DESIGN NOTES / ${String(index).padStart(2,'0')}</div><h2>${current[0]}</h2><p>${current[1]}</p><span class="inspect-pill">${groups.find(g=>g.items.some(i=>i[0]===state.page)).label.slice(5)}</span><div class="inspect-block"><b>本界面覆盖</b><ul>${current[2].split('、').map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="inspect-block"><b>设计语言</b><p style="margin:9px 0">暖白画布承载内容，深墨色强调工作场景；橘色表示主操作，绿色表示已就绪。</p><div class="swatches"><i style="background:#202e33"></i><i style="background:#ef754d"></i><i style="background:#e2f3e9"></i><i style="background:#fffefa;border:1px solid #e5e8e2"></i><i style="background:#b64e4a"></i></div></div><div class="inspect-block"><b>设计稿说明</b><p style="margin:9px 0">包含主应用页面、任务工作流、悬浮窗、屏幕拾取、录制状态与关键弹层。系统授权弹窗及系统文件选择器以入口说明展示。</p></div><div class="shortcut">操作提示：点击手机内的按钮体验流程；点击左侧页面目录可直接跳转到任意状态。</div>`;
      document.querySelector('.nav-item.active')?.scrollIntoView({block:'nearest',inline:'nearest'});
    }
    function navigate(page){if(!meta[page])return;if(page==='recording'&&state.page!=='recording')state.recordPaused=false;state.page=page;history.replaceState(null,'',`#${page}`);render();}
    // 任务卡只显示按入队顺序编号的选择框和名称；单任务运行通过仅选择一个任务后点击底部执行入口完成。
    // 原型交互使用事件委托；切换、筛选和开关都只改变设计稿的展示状态。
    document.addEventListener('click',event=>{
      const link=event.target.closest('[data-go]');if(link){event.preventDefault();navigate(link.dataset.go);return;}
      const action=event.target.closest('[data-action]');if(!action)return;event.preventDefault();
      const type=action.dataset.action,value=action.dataset.value;
      if(type==='toast'||type==='pickerConfirm'){showToast(value);if(type==='pickerConfirm')navigate('floatTools');return;}
      if(type==='openAsset'){state.assetSelected=value;navigate('assetPreview');return;}
      if(type==='runSelected'){navigate('floatRunning');return;}
      if(type==='recordPause'){state.recordPaused=!state.recordPaused;render();return;}
      if(type==='selectTask'){state.selected=state.selected.includes(value)?state.selected.filter(x=>x!==value):[...state.selected,value];render();return;}
      if(['autoSnap','floatEnabled'].includes(type))state[type]=!state[type];
      if(['mode','loop','schedule','recordMode','sampleTab','category'].includes(type))state[type]=value;
      if(type==='scaffold'){document.querySelectorAll('.choice').forEach(e=>e.classList.toggle('active',e===action));document.querySelectorAll('.choice input').forEach(e=>e.checked=e.closest('.choice')===action);return;}
      render();
    });
    document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.classList.contains('choice')){event.preventDefault();event.target.click();}});
    function showToast(text){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;document.querySelector('.device').appendChild(el);setTimeout(()=>el.remove(),2300);}
    const initial=location.hash.slice(1);if(meta[initial])state.page=initial;
    window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(meta[id]&&id!==state.page){state.page=id;render();}});
    render();
  </script>
</body>
</html>
