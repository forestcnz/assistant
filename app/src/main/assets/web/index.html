<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>雕雕助手 · 局域网编辑</title>
  <link rel="icon" type="image/png" href="/app-icon.png">
  <link rel="apple-touch-icon" href="/app-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <img class="brand-mark" src="/app-icon.png" alt="雕雕助手">
        <div>
          <strong>雕雕助手</strong>
          <small>局域网编辑器</small>
        </div>
      </div>
      <nav class="workspace-nav" id="workspace-nav" aria-label="管理页面">
        <a href="#tasks" data-page="tasks" aria-current="page">任务管理</a>
        <a href="#groups" data-page="groups">分组管理</a>
        <a href="#templates" data-page="templates">模板管理</a>
      </nav>
      <div class="server-state" id="server-state">
        <span class="state-dot"></span>
        <span>正在连接</span>
      </div>
    </header>

    <main class="app-main" id="tasks-page">
      <aside class="task-rail" id="task-rail">
        <div class="rail-head">
          <div>
            <p class="eyebrow">TASKS</p>
            <h1>任务空间</h1>
          </div>
          <button class="icon-button" id="create-task" title="新建任务">＋</button>
        </div>
        <label class="search">
          <span>⌕</span>
          <input id="task-search" type="search" placeholder="搜索任务">
        </label>
        <div class="task-list" id="task-list"></div>
        <div class="task-rail-actions"><button class="secondary-button" id="export-all-tasks" title="导出已保存的全部任务、素材、配置和分组顺序" disabled>全部导出</button></div>
      </aside>

      <section class="editor-shell" id="task-editor-host">
        <div class="empty-editor" id="empty-editor">
          <div class="empty-symbol">↗</div>
          <h2>选择任务开始编辑</h2>
          <p>可从左侧切换脚本任务或可视化流程任务。</p>
          <button class="secondary-button mobile-tasks empty-tasks" id="empty-tasks">查看任务列表</button>
          <button class="primary-button" id="empty-create">新建任务</button>
        </div>

        <div class="editor" id="editor" hidden>
          <header class="editor-header">
            <div class="editor-title">
              <button class="mobile-tasks icon-button" id="open-tasks" title="任务列表">☰</button>
              <div>
                <p class="eyebrow" id="editor-context">雕雕助手 / 编辑任务</p>
                <h2 id="current-task-name">—</h2>
              </div>
            </div>
            <div class="editor-actions">
              <span class="save-state" id="save-state">已保存</span>
              <button class="secondary-button" id="exit-template" hidden>结束编辑</button>
              <button class="secondary-button" id="preview-code">代码预览</button>
              <button class="primary-button" id="save-task">保存</button>
            </div>
          </header>

          <nav class="tabs" aria-label="任务功能">
            <button class="tab active" data-mode="script">脚本编辑</button>
            <button class="tab" data-mode="flow">流程编辑</button>
            <button class="tab" data-mode="assets">素材管理</button>
            <button class="tab" id="task-settings">任务设置</button>
            <span class="tab-spacer"></span>
            <span class="meta" id="task-meta"></span>
          </nav>

          <div class="editor-content" id="editor-content"></div>
        </div>
      </section>
    </main>

    <main class="groups-page" id="groups-page" hidden>
      <div class="group-workspace">
        <aside class="groups-sidebar" aria-label="分组列表">
          <div class="rail-head"><div><p class="eyebrow">GROUPS</p><h1>分组空间</h1></div>
            <button class="icon-button" id="create-group" title="新建分组" aria-label="新建分组">＋</button></div>
          <label class="search"><span>⌕</span><input id="group-search" type="search" placeholder="搜索分组"></label>
          <div class="groups-list" id="groups-list"></div>
        </aside>
        <section class="group-detail" id="group-detail" aria-label="分组详情"></section>
      </div>
    </main>
    <main class="templates-page" id="templates-page" hidden>
      <aside class="template-rail" id="template-rail" aria-label="模板列表">
        <div class="rail-head"><div><p class="eyebrow">TEMPLATES</p><h1>模板空间</h1></div><button class="icon-button" data-new-template title="新建模板" aria-label="新建模板">＋</button></div>
        <label class="search"><span>⌕</span><input type="search" id="template-search" placeholder="搜索模板"></label>
        <div class="template-list" id="template-list"></div>
      </aside>
      <section class="editor-shell" id="template-editor-host">
        <div class="empty-editor" id="empty-template-editor"><div class="empty-symbol">▤</div><h2>选择模板开始编辑</h2><p>先创建模板名称，再从左侧选择、编排并保存。</p><button class="secondary-button mobile-tasks empty-tasks" data-open-templates>查看模板列表</button><button class="primary-button" data-new-template>新建模板</button></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-layer" id="modal-layer" hidden></div>
  <input id="image-file-input" type="file" accept="image/*" hidden>
  <input id="asset-file-input" type="file" accept="image/*" multiple hidden>
  <script src="/app.js"></script>
</body>
</html>
