name: Android build and release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Install SDK platform 37
        shell: bash
        run: |
          sdkmanager="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          # 运行器镜像通常已预装 android-37.0 与 build-tools 37.0.0，这里只做兜底。
          # 不要用 `yes | sdkmanager`：sdkmanager 提前退出时 yes 会收到 SIGPIPE，
          # 在 pipefail 下会让整个步骤失败。许可证在 runner 镜像里已接受，直接关掉 stdin 安装即可。
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" < /dev/null

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; release APK would fall back to debug signing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/assistant-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/keystore/assistant-release.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease

      - name: Verify release signing certificate
        shell: bash
        run: |
          apksigner="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/37.0.0/apksigner"
          report=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          cert=$(sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-f]{64})[[:space:]]*$/\1/p' <<< "$report" | sort -u)
          expected=$(sed -n 's/^appReleaseCertificateSha256=//p' gradle.properties)
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$cert" != "$expected" ]]; then
            echo "::error::Release APK signing certificate does not match the configured release certificate."
            exit 1
          fi

      - name: Prepare release files
        id: prepare
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_name="$GITHUB_REF_NAME"
          else
            release_name="manual-${GITHUB_RUN_NUMBER}"
          fi
          safe_release_name="${release_name//\//-}"
          echo "artifact_name=assistant-${safe_release_name}" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/assistant-${safe_release_name}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/assistant-${safe_release_name}-release.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$release_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            previous=$(git describe --tags --match 'v[0-9]*' --exclude '*-*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
            range="$GITHUB_SHA"
            if [[ -n "$previous" ]]; then range="$previous..$GITHUB_SHA"; fi
            notes_file="$RUNNER_TEMP/android-update-notes.txt"
            git log -8 --no-merges --invert-grep --grep='\[skip version bump\]' --format='- %s' "$range" > "$notes_file"
            if [[ ! -s "$notes_file" ]]; then echo "雕雕助手 $release_name" > "$notes_file"; fi
            aapt="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/37.0.0/aapt2"
            python3 .github/scripts/android-update-manifest.py "dist/assistant-${safe_release_name}-release.apk" \
              "$aapt" "https://github.com/${GITHUB_REPOSITORY}/releases" "$release_name" "$notes_file" > dist/update.json
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            title="Android build ${tag}"
          else
            tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            title="Android build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          notes=$(cat <<EOF
          Automated Android build for ${GITHUB_REF_NAME}.

          - Commit: ${GITHUB_SHA}
          - Version: $(grep '^appVersionName=' gradle.properties | cut -d= -f2) ($(grep '^appVersionCode=' gradle.properties | cut -d= -f2))
          - \`*-debug.apk\`: debug build, debug-signed. Installs from different CI runs may require uninstalling the previous build first because each runner uses its own debug signing key.
          - \`*-release.apk\`: release build (non-minified), signed with the project release key. Debug and release APKs use different keys, so installing one over the other requires uninstalling first.
          EOF
          )
          existing=$(gh release view "$tag" --json isDraft 2>/dev/null || true)
          if [[ ! -f dist/update.json ]]; then
            if [[ -z "$existing" ]]; then
              gh release create "$tag" dist/* --title "$title" --notes "$notes" --target "$GITHUB_SHA" --prerelease --latest=false
            fi
            exit 0
          fi

          if [[ -n "$existing" ]] && jq -e '.isDraft == false' <<< "$existing" > /dev/null; then
            exit 0
          fi

          latest_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json isLatest,tagName \
            --jq '.[] | select(.isLatest) | .tagName')
          latest=true
          if [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest_code=$(git show "refs/tags/$latest_tag:gradle.properties" | sed -n 's/^appVersionCode=//p')
            code=$(jq -er '.versionCode' dist/update.json)
            if [[ ! "$latest_code" =~ ^[0-9]+$ ]]; then
              echo '::error::Unable to determine the current stable version code.'
              exit 1
            fi
            if (( code <= latest_code )); then latest=false; fi
          fi

          if [[ -z "$existing" ]]; then
            gh release create "$tag" dist/* --draft --verify-tag --title "$title" --notes "$notes"
          else
            gh release upload "$tag" dist/* --clobber
          fi
          gh release edit "$tag" --draft=false --latest="$latest"
