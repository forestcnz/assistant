name: Bump version on dev -> master merge

# dev 通过 PR 合并进 master 后，minor 位 +1（中间位）：1.1.2 -> 1.2.0，
# 随后把升过版本的 master 同步回 dev，保证两条分支版本号一致。
# 同步成功后根据 master 的版本号创建标签。
on:
  pull_request:
    types:
      - closed
    branches:
      - master
  # 也允许在 Actions 页面手动触发一次（便于首次验证）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-version-master
  cancel-in-progress: false

jobs:
  bump-version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump minor version
        id: bump
        uses: ./.github/actions/bump-version
        with:
          mode: minor

      - name: Commit and push
        id: publish-master
        shell: bash
        env:
          OLD_VERSION: ${{ steps.bump.outputs.old }}
          NEW_VERSION: ${{ steps.bump.outputs.new }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties app/build.gradle.kts
          git commit -m "Bump version to ${NEW_VERSION} [skip version bump]" \
            -m "Automated minor bump from ${OLD_VERSION} to ${NEW_VERSION} after merging dev into master (PR #${PR_NUMBER:-manual})."
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync dev with bumped master
        id: sync-dev
        shell: bash
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # dev 可能与 master 并发有新的 patch 自增提交，推送被拒时重新拉取并重试
          for attempt in 1 2 3; do
            git fetch origin master dev
            git checkout -B dev origin/dev

            # 提交信息带 [skip version bump]，即使同步提交触发了 dev 工作流也不会再自增一次
            if git merge --no-edit \
              -m "Sync dev with master after version bump to ${NEW_VERSION} [skip version bump]" \
              origin/master; then
              :
            else
              # 只允许版本文件的冲突，且统一以 master 上的新版本号为准
              unexpected=0
              while IFS= read -r file; do
                [[ -z "${file}" ]] && continue
                if [[ "${file}" != "gradle.properties" && "${file}" != "app/build.gradle.kts" ]]; then
                  echo "::error::Unexpected merge conflict in ${file}"
                  unexpected=1
                fi
              done < <(git diff --name-only --diff-filter=U)

              if [[ "${unexpected}" -ne 0 ]]; then
                git merge --abort
                exit 1
              fi

              git checkout --theirs -- gradle.properties app/build.gradle.kts
              git add gradle.properties app/build.gradle.kts
              git commit -m "Sync dev with master after version bump to ${NEW_VERSION} [skip version bump]"
            fi

            if git push origin HEAD:dev; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Push to dev was rejected, retrying (${attempt}/3)..."
            sleep $((attempt * 5))
          done

          echo "::error::Failed to sync dev with master after 3 attempts"
          exit 1

      - name: Tag synced master version
        id: tag-version
        shell: bash
        env:
          MASTER_SHA: ${{ steps.publish-master.outputs.sha }}
          SYNCED_DEV_SHA: ${{ steps.sync-dev.outputs.sha }}
          NEW_VERSION: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail

          git fetch origin master dev
          master_sha=$(git rev-parse origin/master)
          if [[ "$master_sha" != "$MASTER_SHA" ]]; then
            echo "::error::master changed after the version bump; refusing to tag an unverified commit"
            exit 1
          fi

          # 从远端 master 的版本文件读取标签名称，并核对本次成功同步的 dev 提交。
          master_props=$(git show origin/master:gradle.properties)
          git merge-base --is-ancestor "$SYNCED_DEV_SHA" origin/dev || {
            echo "::error::dev no longer contains the synced commit"
            exit 1
          }
          dev_props=$(git show "$SYNCED_DEV_SHA":gradle.properties)
          master_version=$(sed -n 's/^appVersionName=//p' <<< "$master_props")
          dev_version=$(sed -n 's/^appVersionName=//p' <<< "$dev_props")
          master_code=$(sed -n 's/^appVersionCode=//p' <<< "$master_props")
          dev_code=$(sed -n 's/^appVersionCode=//p' <<< "$dev_props")
          if [[ ! "$master_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ||
                "$master_version" != "$NEW_VERSION" ||
                "$dev_version" != "$master_version" ||
                "$dev_code" != "$master_code" ]]; then
            echo "::error::master and dev versions are not synchronized; refusing to create a tag"
            exit 1
          fi
          git merge-base --is-ancestor "$master_sha" "$SYNCED_DEV_SHA" || {
            echo "::error::synced dev commit does not contain the tagged master commit"
            exit 1
          }

          tag="v${master_version}"
          # 重跑时允许已有标签指向同一提交；禁止覆盖其他提交上的同名标签。
          remote_tag=$(git ls-remote --tags origin "refs/tags/$tag" | awk 'NR == 1 { print $1 }')
          if [[ -n "$remote_tag" ]]; then
            remote_target=$(git ls-remote --tags origin "refs/tags/$tag^{}" | awk 'NR == 1 { print $1 }')
            remote_target=${remote_target:-$remote_tag}
            if [[ "$remote_target" != "$master_sha" ]]; then
              echo "::error::${tag} already exists on another commit; refusing to move it"
              exit 1
            fi
            echo "${tag} already points to ${master_sha}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$master_sha" -m "Release $tag"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 推送标签不会触发其他 push 工作流，显式派发已有的发布流程。
      - name: Start Android release for tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag-version.outputs.tag }}
        run: gh workflow run android-release.yml --ref "$TAG"
